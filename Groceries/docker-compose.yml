services:
  # One-shot manual scrape: runs collector.py once and exits. Behind the
  # "manual" profile so a plain `docker compose up -d` does NOT start it (#63) -
  # before this, every `up`, including after a reboot, kicked off a full
  # ~20-minute scrape. Run it deliberately:
  #   docker compose --profile manual run --rm grocery_scraper
  grocery_scraper:
    profiles: ["manual"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_NAME=grocery_db
      - DB_USER=user
      - DB_PASS=password
    networks:
      - my_network

  # Same image/build as grocery_scraper (#33) - runs cron in the foreground
  # instead of scraping once and exiting, so prices stay fresh without anyone
  # remembering anything. Part of the default set: a plain `docker compose up
  # -d` starts db, webapp, db_backup and this (#63). At start it also runs a
  # catch-up scrape if the newest prices are over 26h old, since cron never
  # re-runs a 03:00 the host was off for - see scheduler_entrypoint.sh.
  scraper_scheduler:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_NAME=grocery_db
      - DB_USER=user
      - DB_PASS=password
    networks:
      - my_network
    entrypoint: ["/app/scheduler_entrypoint.sh"]
    restart: unless-stopped

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: grocery_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - my_network
    # Without this, `depends_on` only waits for the container to *start*, not for
    # Postgres to accept connections - so a webapp restart during db startup
    # served 500s until the database came up (#71).
    #
    # `-h 127.0.0.1` is load-bearing, not decoration. Without it pg_isready uses
    # the unix socket, and the postgres image's *temporary* initdb server listens
    # on that socket during first-time initialization - so the probe reports ready
    # while the real server is still coming up. Measured on a throwaway volume
    # with a 0.1s prober: the socket said READY about 2.2s before TCP did, and
    # clients connecting in that window were refused with "FATAL: the database
    # system is shutting down". The webapp survives that (init_schema.py retries),
    # but grocery_scraper connects once with no retry and no `restart:` policy,
    # so a clean `docker compose up -d` could launch a one-shot scrape that dies
    # instantly and silently. Probing TCP probes the server that will actually
    # still be there.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d grocery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Recovery from an unclean shutdown replays WAL before accepting
      # connections, which on a large grocery_prices can outlast a few intervals.
      start_period: 30s

  # Nightly pg_dump to a host directory (#60). Recipes and meal history exist only
  # in the db_data volume and are NOT re-derivable - prices are, recipes aren't -
  # so before this service existed a single `down -v` or disk failure was
  # unrecoverable.
  #
  # Uses the postgres image for a version-matched pg_dump: no build step, no cron,
  # just backup.sh in a loop (that file explains why a loop rather than cron).
  db_backup:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: user
      PGPASSWORD: password
      PGDATABASE: grocery_db
      # Days of dumps to retain; older ones are pruned so this cannot fill the disk.
      BACKUP_KEEP_DAYS: "14"
      # Container-local time, and the postgres image runs UTC, so this is 03:30
      # UTC. Deliberately after scraper-cron's 03:00 scrape, so the nightly dump
      # follows the nightly scrape rather than racing it.
      BACKUP_HOUR: "3"
      BACKUP_MINUTE: "30"
      # Excludes grocery_prices ROWS (its schema and the grocery_prices_latest
      # view are still dumped) because that table is ~17M rows/year of data the
      # scraper can regenerate, and including it turns a kilobyte-scale dump into
      # a gigabyte-scale one. Set "true" to keep price history. backup.sh logs
      # which mode ran on every attempt, so nobody has to guess what a dump holds.
      BACKUP_INCLUDE_PRICES: "false"
    volumes:
      # Host bind mount, deliberately OUTSIDE the db_data volume: a backup stored
      # inside the thing it backs up is not a backup. Relative to this file, so
      # ../backups is the repo root. Gitignored.
      - ../backups:/backups
      - ./backup.sh:/backup.sh:ro
    networks:
      - my_network
    # Overriding the postgres image's entrypoint also skips its `gosu postgres`
    # privilege drop, so without this the container runs as root and every dump
    # lands on the host as root:root - readable by the household user but not
    # deletable without sudo. Matching the host uid keeps the backups directory
    # manageable and is consistent with the webapp's uid 10001 (#71).
    #
    # Interpolated rather than hardcoded, because 1000 is only the conventional
    # first user on Debian/Ubuntu/Fedora - it is not universal, and a host whose
    # primary user is 1001 or 501 would silently get dumps it cannot manage (#92).
    # Set BACKUP_UID/BACKUP_GID in Groceries/.env to match `id -u` / `id -g`.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["/bin/bash", "/backup.sh"]
    restart: unless-stopped

  # Reachable over LAN and, since the host itself is Tailscale-joined, over
  # the tailnet too via the host's own tailscale0 interface - no sidecar
  # container needed. This replaces an earlier Tailscale-sidecar-in-Docker
  # approach (a separate container joining the tailnet as its own node,
  # needing its own TS_AUTHKEY) that was never actually verified end-to-end
  # and added a failure mode (an unauthenticated sidecar loops on auth
  # retries, restarting and dropping the network namespace any container
  # sharing it depends on). If this ever needs to run somewhere the host
  # itself isn't already on the tailnet, reintroduce a sidecar (or a
  # `tailscale serve`/funnel setup) rather than publishing the port as
  # below.
  webapp:
    build: ./webapp
    depends_on:
      db:
        # Waits for Postgres to accept connections, not merely for the container
        # to exist (#71). init_schema.py also retries on its own, so this is
        # belt-and-braces rather than the only thing standing between a restart
        # and a wall of 500s.
        condition: service_healthy
    ports:
      # Host side is configurable, container side is not. The app, /healthz and
      # the healthcheck all keep referring to 5000 inside the container; only the
      # published mapping moves (#90).
      #
      # This is not hypothetical portability polish. On the deployment host
      # (gigabyte) 5000 is Frigate - the family's camera NVR - and 5001 is
      # sleep-tracker. An always-on box hosting a dozen services is the normal
      # case, not the exception, and a hardcoded host port meant the only way to
      # deploy was to edit a tracked file, which turns every `git pull` into a
      # possible conflict.
      #
      # ${WEBAPP_PORT:-5000} is interpolated by compose from Groceries/.env (the
      # *project directory*), NOT from the repo-root .env that `env_file` below
      # passes into the container. Two different mechanisms, easy to conflate -
      # see Groceries/.env.example. Defaulting to 5000 keeps existing setups and
      # the dev host unchanged.
      - "${WEBAPP_PORT:-5000}:5000"
    networks:
      - my_network
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_NAME=grocery_db
      - DB_USER=user
      - DB_PASS=password
    restart: unless-stopped
    # `restart: unless-stopped` only acts when the container *exits*. A process
    # that is hung but alive looks fine to Docker forever without this (#71).
    #
    # Be honest about what this does and doesn't catch. It reliably detects a
    # dead or wedged process and loss of the database, because /healthz opens a
    # connection and runs SELECT 1. It does NOT detect one slow request: with
    # 2 workers x 4 threads there are 8 request slots, so a single
    # /planner/ingredients hanging on synchronous USDA calls (#64) blocks one of
    # them and /healthz still answers 200 on another. Only full saturation - all
    # 8 slots wedged - trips it. That is a real limitation, not a safety net for
    # #64; #64 still has to be fixed on its own merits.
    #
    # Probes /healthz with the image's own interpreter: python:3.12-slim ships no
    # curl and no wget, so the usual `curl -f` healthcheck would fail on a
    # perfectly healthy container. urlopen raises HTTPError on a non-2xx
    # response, which exits non-zero - and Docker keys off the exit code, not the
    # HTTP status, so /healthz's 503-vs-500 distinction is for humans and
    # proxies rather than for this.
    #
    # start_period is 90s. It deliberately does NOT cover init_schema.py's full
    # theoretical retry budget: CONNECT_TIMEOUT applies per attempt, so the worst
    # case is 30 x (2s sleep + 5s connect) = 210s, not the 65s an earlier version
    # of this comment claimed. 90s is still the right value, for two reasons.
    # First, `depends_on: service_healthy` means the database is already
    # accepting connections before this container starts, so init_schema normally
    # succeeds on attempt 1 and the retry budget is a fallback rather than the
    # expected path. Second, exceeding start_period is cosmetic here: Docker
    # *labels* a container unhealthy but does not restart it for being so, and
    # nothing depends on webapp's health, so the cost of a too-short window is a
    # misleading `docker ps` line during a genuinely slow database start - not a
    # restart loop.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  my_network:

volumes:
  db_data:
