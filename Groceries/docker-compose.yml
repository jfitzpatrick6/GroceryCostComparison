services:
  grocery_scraper:
    build: .
    depends_on:
      - db
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_NAME=grocery_db
      - DB_USER=user
      - DB_PASS=password
    networks:
      - my_network

  # Same image/build as grocery_scraper (#33) - runs cron in the foreground
  # instead of scraping once and exiting, so prices stay fresh without
  # anyone needing to remember to run `docker compose up grocery_scraper`
  # by hand. Purely additive: grocery_scraper's one-shot behavior above is
  # unchanged, this is an opt-in second way to run the same image. Not
  # started by a bare `docker compose up` - add it explicitly (`docker
  # compose up -d scraper_scheduler`) since it's meant to run continuously.
  scraper_scheduler:
    build: .
    depends_on:
      - db
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_NAME=grocery_db
      - DB_USER=user
      - DB_PASS=password
    networks:
      - my_network
    entrypoint: ["/app/scheduler_entrypoint.sh"]
    restart: unless-stopped

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: grocery_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - my_network

  # Tailscale sidecar (see #34) - webapp joins this container's network
  # namespace below, so it's reachable at whatever tailnet address this
  # gets, not the public internet or LAN presence. Needs TS_AUTHKEY in
  # .env (generate one at https://login.tailscale.com/admin/settings/keys).
  # NOT verified end-to-end from this environment - no Tailscale account
  # available here. This is the standard documented sidecar pattern, but
  # confirm the container actually appears in your tailnet before relying
  # on it. ports: below is a local/LAN fallback for testing independent of
  # Tailscale auth succeeding.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: grocery-webapp
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - my_network

  webapp:
    build: ./webapp
    depends_on:
      - db
      - tailscale
    network_mode: service:tailscale
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_NAME=grocery_db
      - DB_USER=user
      - DB_PASS=password
    restart: unless-stopped

networks:
  my_network:

volumes:
  db_data:
  tailscale_state:
