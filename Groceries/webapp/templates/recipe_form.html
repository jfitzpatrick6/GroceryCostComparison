{% extends "base.html" %}
{% block title %}{{ "Edit" if recipe else "New" }} Recipe - Grocery Cost Comparison{% endblock %}
{% block content %}
<h1>{{ "Edit" if recipe else "New" }} Recipe</h1>
<form method="post">
    <p><label>Name<br><input type="text" name="name" value="{{ recipe.name if recipe else '' }}" required style="width:100%"></label></p>
    <p><label>Servings<br><input type="number" name="servings" value="{{ recipe.servings if recipe else '' }}"></label></p>
    <p><label>Notes<br><textarea name="notes" rows="3" style="width:100%">{{ recipe.notes if recipe else '' }}</textarea></label></p>
    <p><label>Ingredients (one per line, e.g. "2 cups flour")<br>
        <textarea name="ingredients" rows="10" style="width:100%">{{ ingredients_text }}</textarea>
    </label></p>
    <button type="submit">Save</button>
</form>
{% endblock %}
