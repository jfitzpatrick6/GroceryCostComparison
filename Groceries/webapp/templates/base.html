<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Grocery Cost Comparison{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; max-width: 60rem; }
        nav a { margin-right: 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.4rem 0.8rem; border-bottom: 1px solid #ddd; }
        th a { text-decoration: none; }
        input[type=text] { padding: 0.4rem; width: 20rem; max-width: 100%; }
        /* Real usage is mostly a phone at the store or checking "what's for
           dinner" (#49), not the laptop planning happened on - bigger tap
           targets and no page-wide horizontal scroll, without restyling
           every page into cards (deliberately not a redesign). */
        button, input[type=submit], select, input[type=number] {
            min-height: 2.75rem; font-size: 1rem; padding: 0.4rem 0.6rem;
        }
        input[type=text] { min-height: 2.75rem; font-size: 1rem; }
        @media (max-width: 600px) {
            body { margin: 0.75rem; }
            nav a { margin-right: 0.6rem; display: inline-block; padding: 0.3rem 0; }
            /* Data tables can scroll within themselves; the page never
               should - table becomes its own horizontally-scrollable block
               while thead/tbody/tr/td keep their table layout, so no
               per-page markup changes are needed to get this. */
            table { display: block; overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/prices">Prices</a>
        <a href="/staples">Staples</a>
        <a href="/list">Grocery List</a>
        <a href="/recipes">Recipes</a>
        <a href="/planner">Planner</a>
        <a href="/pantry">Pantry</a>
        <a href="/history">History</a>
        <a href="/profiles">Profiles</a>
        <span style="float:right">
            <form method="post" action="/profiles/switch" style="display:inline">
                <select name="name" onchange="this.form.submit()">
                    <option value="">-- who are you? --</option>
                    {% for n in all_profile_names %}
                    <option value="{{ n }}" {% if n == active_profile_name %}selected{% endif %}>{{ n }}</option>
                    {% endfor %}
                </select>
                <noscript><button type="submit">Switch</button></noscript>
            </form>
        </span>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
