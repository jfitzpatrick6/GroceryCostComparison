name: CI

# The gate described in CONTRIBUTING.md. Nothing merges to master with this red.
#
# Two independent jobs, because they answer different questions:
#   lint  - is the code statically sound, and is it syntax the *oldest* runtime
#           we ship can parse? (ruff's target-version is py310, matching the
#           scraper container; the webapp container is 3.12.)
#   test  - does behavior hold on the runtime the webapp actually ships in?
#
# Neither job needs a Postgres service. The tests under Groceries/webapp/ cover
# matching.py (pure functions over fixture catalogs) and app.py's USDA lookup
# (requests.get monkeypatched to fixtures). Anything that would need a live
# database is not yet tested - see the "Testing" section of CONTRIBUTING.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A force-push or new commit to an open PR cancels the run that was already in
# flight for it - no point burning minutes on a commit that's been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned rather than floating so a ruff release can't turn master red
      # overnight with a new default rule. Rule selection lives in
      # pyproject.toml; bumping this is a deliberate, reviewed act.
      - name: Install ruff
        run: pip install "ruff==0.16.9"

      - name: Ruff check
        run: ruff check .

      # Ruff's formatter is deliberately NOT run here. This repo has an
      # established hand-maintained layout (long "why" comments wrapped to a
      # readable width, SQL aligned inside triple-quoted strings) that
      # `ruff format` would reflow wholesale, producing a diff with no
      # behavioral content. Lint is enforced; formatting is not.

  test:
    name: Test (pytest, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The webapp's own pins. psycopg2-binary is imported by app.py at module
      # load, so it has to be installed for the tests to import it - but no
      # database is ever contacted.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Groceries/webapp/requirements.txt
          pip install "pytest>=8"

      - name: Run tests
        env:
          # Present only if the repo secret is configured. Without it the
          # live-FDC suite in test_usda_matching.py skips itself (via
          # @skipUnless) and the mocked suite still runs - so CI stays green
          # either way, but a configured secret buys real-API verification of
          # the ingredient-matching behavior that mocks can't stand in for.
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: pytest -v

      - name: Report whether live FDC tests ran
        if: always()
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          if [ -z "$USDA_API_KEY" ]; then
            echo "::warning::USDA_API_KEY secret not set - LiveUsdaApiTests skipped. Mocked coverage still ran, but real-API ingredient matching was not verified."
          fi
